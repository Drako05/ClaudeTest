<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <title>Verdant — spike 3D</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1020;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas { display: block; width: 100%; height: 100%; }
      /* Abajo a la derecha: en un telefono ahi llega el pulgar, y arriba se
         solapaba con el HUD en pantalla estrecha. */
      #proj {
        position: fixed; z-index: 11;
        bottom: calc(18px + env(safe-area-inset-bottom));
        right: calc(14px + env(safe-area-inset-right));
        -webkit-appearance: none; appearance: none;
        min-width: 118px; padding: 11px 14px; border-radius: 12px;
        font: 600 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: .08em; text-transform: uppercase;
        color: #e8eef7; background: rgba(8, 14, 28, 0.82);
        border: 1px solid rgba(140, 190, 255, 0.34);
        backdrop-filter: blur(6px); cursor: pointer;
        touch-action: manipulation;
      }
      #proj:active { transform: scale(.95); background: rgba(60, 104, 168, .72); }
      #proj:focus-visible { outline: 2px solid #8fc4ff; outline-offset: 3px; }
      #proj small {
        display: block; margin-top: 3px; font-size: 10px;
        font-weight: 400; letter-spacing: .04em; text-transform: none; color: #8fb4dd;
      }

      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        padding: 9px 12px; border-radius: 10px;
        background: rgba(8, 14, 28, 0.78);
        border: 1px solid rgba(140, 190, 255, 0.22);
        font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #cfe0f5; white-space: pre; backdrop-filter: blur(6px);
        max-width: calc(100vw - 24px); overflow-x: auto;
      }

      @media (max-width: 560px) {
        #hud { font-size: 10.5px; padding: 7px 9px; }
        #proj { min-width: 104px; padding: 10px 12px; font-size: 11px; }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <button id="proj" type="button">
      Ortográfica
      <small>tocar para cambiar</small>
    </button>
    <div id="hud">cargando…</div>
    <script type="module" src="/src/spike3d/main.ts"></script>
  </body>
</html>

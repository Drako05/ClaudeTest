<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <title>Verdant — spike 3D</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1020;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas { display: block; width: 100%; height: 100%; }
      /* Abajo a la derecha: en un telefono ahi llega el pulgar, y arriba se
         solapaba con el HUD en pantalla estrecha. */
      #proj {
        position: fixed; z-index: 11;
        bottom: calc(18px + env(safe-area-inset-bottom));
        right: calc(14px + env(safe-area-inset-right));
        -webkit-appearance: none; appearance: none;
        min-width: 118px; padding: 11px 14px; border-radius: 12px;
        font: 600 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: .08em; text-transform: uppercase;
        color: #e8eef7; background: rgba(8, 14, 28, 0.82);
        border: 1px solid rgba(140, 190, 255, 0.34);
        backdrop-filter: blur(6px); cursor: pointer;
        touch-action: manipulation;
      }
      #proj:active { transform: scale(.95); background: rgba(60, 104, 168, .72); }
      /* El salto, justo encima del de proyeccion y bajo el mismo pulgar. Es
         redondo y grande porque se usa constantemente, al reves que aquel. */
      #jump {
        position: fixed; z-index: 11;
        bottom: calc(84px + env(safe-area-inset-bottom));
        right: calc(14px + env(safe-area-inset-right));
        -webkit-appearance: none; appearance: none;
        width: 86px; height: 86px; border-radius: 50%;
        font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: .1em; text-transform: uppercase;
        color: #e8eef7; background: rgba(8, 14, 28, 0.82);
        border: 1px solid rgba(140, 190, 255, 0.34);
        backdrop-filter: blur(6px); cursor: pointer;
        touch-action: manipulation;
      }
      #jump b { display: block; font-size: 22px; line-height: 1; margin-bottom: 3px; }
      #jump:active { transform: scale(.95); background: rgba(60, 104, 168, .72); }
      #jump:focus-visible { outline: 2px solid #8fc4ff; outline-offset: 3px; }
      /* Correr, encima del salto y con el mismo pulgar. Es un INTERRUPTOR, no
         un boton que se mantiene: en un telefono no sobran dedos. */
      #run {
        position: fixed; z-index: 11;
        bottom: calc(178px + env(safe-area-inset-bottom));
        right: calc(14px + env(safe-area-inset-right));
        -webkit-appearance: none; appearance: none;
        width: 86px; height: 86px; border-radius: 50%;
        font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: .1em; text-transform: uppercase;
        color: #e8eef7; background: rgba(8, 14, 28, 0.82);
        border: 1px solid rgba(140, 190, 255, 0.34);
        backdrop-filter: blur(6px); cursor: pointer;
        touch-action: manipulation;
      }
      #run b { display: block; font-size: 22px; line-height: 1; margin-bottom: 3px; }
      #run:active { transform: scale(.95); }
      #run:focus-visible { outline: 2px solid #8fc4ff; outline-offset: 3px; }
      /* Encendido: tiene que verse, porque cambia como responde el movimiento. */
      #run.on {
        background: rgba(60, 104, 168, .86);
        border-color: rgba(170, 214, 255, .75);
        color: #f4f9ff;
      }
      #proj:focus-visible { outline: 2px solid #8fc4ff; outline-offset: 3px; }
      #proj small {
        display: block; margin-top: 3px; font-size: 10px;
        font-weight: 400; letter-spacing: .04em; text-transform: none; color: #8fb4dd;
      }

      /* El joystick flotante: nace donde apoyas el pulgar dentro del cuadrante
         inferior izquierdo. Verlo es lo que hace evidente que esa zona es del
         personaje y el resto de la camara. */
      #stick {
        position: fixed; z-index: 11; width: 116px; height: 116px;
        margin: -58px 0 0 -58px; border-radius: 50%;
        border: 2px solid rgba(180, 215, 255, 0.30);
        background: radial-gradient(circle, rgba(20,34,60,.42), rgba(20,34,60,.14));
        opacity: 0; visibility: hidden; transition: opacity .12s ease;
        pointer-events: none;
      }
      #stick.on { opacity: 1; visibility: visible; }
      #stickKnob {
        position: absolute; left: 50%; top: 50%;
        width: 46px; height: 46px; border-radius: 50%;
        background: rgba(143, 196, 255, .58);
        border: 2px solid rgba(226, 240, 255, .72);
        transform: translate(-50%, -50%);
      }

      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        padding: 9px 12px; border-radius: 10px;
        background: rgba(8, 14, 28, 0.78);
        border: 1px solid rgba(140, 190, 255, 0.22);
        font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #cfe0f5; white-space: pre; backdrop-filter: blur(6px);
        max-width: calc(100vw - 24px); overflow-x: auto;
      }

      @media (max-width: 560px) {
        /* El joystick flotante: nace donde apoyas el pulgar dentro del cuadrante
         inferior izquierdo. Verlo es lo que hace evidente que esa zona es del
         personaje y el resto de la camara. */
      #stick {
        position: fixed; z-index: 11; width: 116px; height: 116px;
        margin: -58px 0 0 -58px; border-radius: 50%;
        border: 2px solid rgba(180, 215, 255, 0.30);
        background: radial-gradient(circle, rgba(20,34,60,.42), rgba(20,34,60,.14));
        opacity: 0; visibility: hidden; transition: opacity .12s ease;
        pointer-events: none;
      }
      #stick.on { opacity: 1; visibility: visible; }
      #stickKnob {
        position: absolute; left: 50%; top: 50%;
        width: 46px; height: 46px; border-radius: 50%;
        background: rgba(143, 196, 255, .58);
        border: 2px solid rgba(226, 240, 255, .72);
        transform: translate(-50%, -50%);
      }

      #hud { font-size: 10.5px; padding: 7px 9px; }
        #proj { min-width: 104px; padding: 10px 12px; font-size: 11px; }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="stick" aria-hidden="true"><i id="stickKnob"></i></div>
    <button id="run" type="button" aria-label="Correr" aria-pressed="false">
      <b aria-hidden="true">&#187;</b>
      Correr
    </button>
    <button id="jump" type="button" aria-label="Saltar">
      <b aria-hidden="true">&#8593;</b>
      Saltar
    </button>
    <button id="proj" type="button">
      Ortográfica
      <small>tocar para cambiar</small>
    </button>
    <div id="hud">cargando…</div>
    <script type="module" src="/src/spike3d/main.ts"></script>
  </body>
</html>

name: CI

on:
  push:
    branches: ['main', 'pruebas']
  pull_request:
  schedule:
    # Martes y sabado, 08:00 UTC = 3:00 en Bogota (UTC-5 todo el ano).
    - cron: '0 8 * * 2,6'
  workflow_dispatch:

# Sin duplicados (decision del autor, 2026-10-24): el mismo commit corria dos o
# tres veces —`pruebas`, la rama `claude/…` y `main`—, 7-9 minutos cada una.
# Las ramas `claude/…` ya no la disparan, y un push a `main` corre solo el
# nucleo, porque ese arbol ya paso la CI completa en `pruebas`. La completa
# corre tambien martes y sabado y a mano (`workflow_dispatch`).
#
# En la rama `pruebas` un push nuevo deja viejo al anterior: se cancela. Ahi se
# verifica el trabajo antes de llevarlo a `main` (`tools/a-pruebas.sh`). En
# `main` no se cancela nada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/pruebas' }}

# Repartida para que no tarde: el nucleo por un lado y cada pasada del
# navegador en su propia maquina, todas a la vez. Antes era una sola cola de
# ~19 minutos (16 de humo); ahora tarda lo que la pasada mas larga.
jobs:
  nucleo:
    name: Typecheck y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          navegador: 'false'
      - name: Typecheck
        run: npm run typecheck
      - name: Tests del nucleo
        run: npm test

  navegador:
    name: ${{ matrix.pasada }}
    runs-on: ubuntu-latest
    # Un push a `main` lo salta: lo corren entero `pruebas`, los PR, el
    # calendario y el lanzamiento a mano.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    strategy:
      # Un fallo no cancela las demas: se ve de una vez todo lo que falla.
      fail-fast: false
      matrix:
        # Una casilla por pasada de `tools/smoke.mjs` (se lanza por el prefijo
        # de su nombre), los gestos con toques de verdad y el barrido en
        # pixeles, una casilla por parte (`tools/slash-partes.mjs`): entero
        # eran ~15 minutos y marcaba lo que tardaba la CI (2026-10-10). Si se
        # anade una pasada al humo o una parte al barrido, va aqui tambien: el
        # escaner de la auditoria lo cruza.
        pasada: [desktop, resources, stations, mobile, devTools, life, relief, highRefresh, fauna, dig, gestures, slash-normal, slash-baja, slash-cerca, slash-primera, slash-estocada]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - name: Build del cliente
        run: npm run build
      - name: Prueba de humo, pasada ${{ matrix.pasada }}
        if: matrix.pasada != 'gestures' && !startsWith(matrix.pasada, 'slash-')
        run: node tools/smoke.mjs ${{ matrix.pasada }}
      # Los gestos con dedos de verdad (CDP): arrastrar, sostener el ojo, la
      # barra del angulo, el dedo de ATAQUE que gira. El humo usa toques
      # sinteticos y no ve lo que el navegador decide sobre un dedo real.
      - name: Gestos tactiles con toques de verdad
        if: matrix.pasada == 'gestures'
        run: node tools/gestures.mjs
      # El barrido contado en pixeles, una parte por casilla: que se MANDE
      # dibujar no dice que se VEA.
      - name: Barrido en pixeles
        if: startsWith(matrix.pasada, 'slash-')
        run: node tools/slash.mjs "${PASADA#slash-}"
        env:
          PASADA: ${{ matrix.pasada }}
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.pasada }}
          path: screenshots/
          if-no-files-found: ignore

  # Un unico estado para todo el conjunto: verde solo si todo lo es. El
  # navegador saltado vale solo en un push a `main`; en cualquier otro caso, un
  # `skipped` es rojo.
  todo:
    name: CI completa
    runs-on: ubuntu-latest
    needs: [nucleo, navegador]
    if: always()
    steps:
      - name: Comprobar que todo paso
        env:
          NUCLEO: ${{ needs.nucleo.result }}
          NAVEGADOR: ${{ needs.navegador.result }}
          PUSH_A_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          test "$NUCLEO" = success
          if [ "$PUSH_A_MAIN" = true ]; then
            test "$NAVEGADOR" = success -o "$NAVEGADOR" = skipped
          else
            test "$NAVEGADOR" = success
          fi

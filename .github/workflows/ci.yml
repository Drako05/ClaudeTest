name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests del nucleo
        run: npm test
      - name: Build del cliente
        run: npm run build
      - name: Prueba de humo en navegador
        run: |
          npx playwright install --with-deps chromium
          node tools/smoke.mjs
      # Los dos humos mientras conviven los dos clientes: el del 3D es el que
      # tiene que estar en verde antes de poder retirar el isometrico.
      - name: Build del cliente 3D
        run: npm run spike
      - name: Prueba de humo del 3D
        run: node tools/smoke3d.mjs
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

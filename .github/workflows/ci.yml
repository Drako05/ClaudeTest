name: CI

on:
  push:
    branches: ['**']
  pull_request:

# En la rama `pruebas` un push nuevo deja viejo al anterior: se cancela. Ahi se
# verifica el trabajo antes de llevarlo a `main` (`tools/a-pruebas.sh`). En
# `main` cada push corre entero.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/pruebas' }}

# Repartida para que no tarde: el nucleo por un lado y cada pasada del
# navegador en su propia maquina, todas a la vez. Antes era una sola cola de
# ~19 minutos (16 de humo); ahora tarda lo que la pasada mas larga.
jobs:
  nucleo:
    name: Typecheck y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          navegador: 'false'
      - name: Typecheck
        run: npm run typecheck
      - name: Tests del nucleo
        run: npm test

  navegador:
    name: ${{ matrix.pasada }}
    runs-on: ubuntu-latest
    strategy:
      # Un fallo no cancela las demas: se ve de una vez todo lo que falla.
      fail-fast: false
      matrix:
        # Una casilla por pasada de `tools/smoke.mjs` (se lanza por el prefijo
        # de su nombre), los gestos con toques de verdad y el barrido en
        # pixeles. Si se anade una pasada al humo, va aqui tambien: el escaner
        # de la auditoria lo cruza.
        pasada: [desktop, resources, stations, mobile, devTools, life, relief, highRefresh, fauna, gestures, slash]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - name: Build del cliente
        run: npm run build
      - name: Prueba de humo, pasada ${{ matrix.pasada }}
        if: matrix.pasada != 'gestures' && matrix.pasada != 'slash'
        run: node tools/smoke.mjs ${{ matrix.pasada }}
      # Los gestos con dedos de verdad (CDP): arrastrar, sostener el ojo, la
      # barra del angulo, el dedo de ATAQUE que gira. El humo usa toques
      # sinteticos y no ve lo que el navegador decide sobre un dedo real.
      - name: Gestos tactiles con toques de verdad
        if: matrix.pasada == 'gestures'
        run: node tools/gestures.mjs
      # El barrido contado en pixeles, en las tres vistas y en el peor de
      # cuatro rumbos: que se MANDE dibujar no dice que se VEA.
      - name: Barrido en pixeles
        if: matrix.pasada == 'slash'
        run: node tools/slash.mjs
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.pasada }}
          path: screenshots/
          if-no-files-found: ignore

  # Un unico estado para todo el conjunto: verde solo si todo lo es.
  todo:
    name: CI completa
    runs-on: ubuntu-latest
    needs: [nucleo, navegador]
    if: always()
    steps:
      - name: Comprobar que todo paso
        run: |
          test "${{ needs.nucleo.result }}" = success
          test "${{ needs.navegador.result }}" = success

name: Deploy a GitHub Pages

on:
  push:
    branches: ['claude/capabilities-workflow-confirmation-mgqdm5', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Publica los dos juegos: el isometrico en la raiz y el 3D en /3d/. La
      # migracion a 3D esta decidida pero no hecha, asi que sustituir uno por
      # otro dejaria sin URL al unico juego completo que hay.
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
        with:
          # Crea el sitio de Pages si aun no existe, en vez de fallar pidiendo
          # que se active a mano en los ajustes del repositorio. Requiere el
          # permiso pages: write que ya esta declarado arriba.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
